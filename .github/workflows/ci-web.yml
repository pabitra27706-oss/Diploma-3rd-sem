# SPDX-License-Identifier: MIT
# See LICENSE for the full text. Covers the project's own code/authored content;
# third-party exam-source material has separate, unresolved rights (docs/DECISIONS.md).
# WebFlow no-device gate for this zero-build site.
#
# The committed files are what GitHub Pages serves, so this workflow only
# checks them and uploads a downloadable preview. Deploying is a separate,
# owner-approved action and is deliberately absent here (rule.md §2).
name: Web CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks + preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax — every JS file must parse
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if node --check "$f" 2>/dev/null; then
              continue
            fi
            # ES module syntax (import/export) needs module mode via stdin.
            if node --check --input-type=module < "$f" 2>/dev/null; then
              continue
            fi
            echo "::error file=$f::JavaScript does not parse"
            node --check "$f" || true
            fail=1
          done < <(find . -path ./.git -prune -o -path ./node_modules -prune -o \( -name '*.js' -o -name '*.cjs' \) -print0)
          echo "JS files checked: $count"
          exit $fail

      - name: PYQ data validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/validate_pyq.py ]; then
            python3 scripts/validate_pyq.py
          else
            echo "No scripts/validate_pyq.py — skipping."
          fi

      - name: Syllabus validation (advisory until Phase 2 closes coverage)
        shell: bash
        run: |
          set -euo pipefail
          # Phase 2 flips this to --strict. Today it reports the known
          # out-of-syllabus unit tags and the missing CST207 quiz bank.
          python3 scripts/validate_syllabus.py | tee syllabus-check.txt
          {
            echo "### Syllabus join"
            echo '```'
            cat syllabus-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Site checks — links, JSON, structure, accessibility basics, budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_site.py --strict --report site-check.txt
          {
            echo "### Site check"
            echo '```'
            head -n 40 site-check.txt
            echo '```'
            echo
            echo "Full report: the \`site-check\` artifact (or the job log)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Platform integrity and deterministic generated files
        run: python3 scripts/check_platform.py

      - name: Measured accessibility gate (Phase 7)
        shell: bash
        run: |
          set -euo pipefail
          # Fails when a page loses its landmark/skip link/heading order, a
          # control loses its label, a token pair drops below its required
          # contrast, an animating sheet loses its reduced-motion rule, or a
          # control box is pinned below 24x24 CSS px. Not a WCAG conformance
          # test: rendered contrast and device behaviour are Phase 10.
          python3 scripts/audit_accessibility.py --fail | tee accessibility-check.txt
          {
            echo "### Measured accessibility"
            echo '```'
            cat accessibility-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Documentation paths resolve (Phase 7)
        run: python3 scripts/check_readme_paths.py

      - name: One token file, generated icon CSS and generated data version (Phase 9)
        shell: bash
        run: |
          set -euo pipefail
          # Phase 9.2/9.3 gates: no colour literal outside the palette, the icon
          # CSS subset is current, and the data cache version matches the data.
          python3 scripts/check_tokens.py --strict | tee token-check.txt
          python3 scripts/build_icon_subset.py --check
          python3 scripts/build_data_version.py --check
          {
            echo "### Colour tokens and generated assets"
            echo '```'
            cat token-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Page weight and base-path readiness (Phase 9)
        shell: bash
        run: |
          set -euo pipefail
          # Budget fence (300 KB CSS / 350 KB JS per page) and the /-rooted copy
          # proof. These are byte and link checks, not Lighthouse scores.
          python3 scripts/audit_page_weight.py --budget > budgets-pages.txt
          cat budgets-pages.txt >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_root_rewrite.py | tee root-rewrite.txt
          cat root-rewrite.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Data regression gate (source-verification exceptions pending)
        run: |
          # Full --strict remains blocked; accept only the exact fingerprinted
          # findings in docs/data/validation-exceptions.json, never new errors.
          python3 scripts/check_pyq_integrity.py
          node tests/attempt-store.cjs
          node tests/quiz-engine-dom.cjs
          node tests/storage.cjs
          node tests/storage-recovery.cjs
          node tests/study-store.cjs
          node tests/study-dom.cjs
          node tests/study-offline.cjs
          node tests/data-pipeline-consumers.cjs
          node tests/discovery-dom.cjs
          node tests/data-version.cjs
          python3 scripts/validate_data.py --check-baseline
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Asset budgets summary
        run: |
          python3 scripts/report_budgets.py > budgets.txt
          cat budgets.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the downloadable site preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: |
            .
            !.git/**
            !node_modules/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload the site-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check
          path: site-check.txt
          if-no-files-found: warn
          retention-days: 14
