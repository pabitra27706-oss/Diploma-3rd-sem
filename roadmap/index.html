<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="10-Day Theory Roadmap — Diploma 3rd Semester CST">
  <title>10-Day Roadmap — Diploma 3rd Sem</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <button class="btn-icon" id="btn-back" aria-label="Go back">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#arrow-left"></use>
      </svg>
    </button>
    <h1 class="header-title">10-Day Roadmap</h1>
    <button class="btn-icon" id="btn-theme" aria-label="Toggle theme">
      <svg class="icon icon-moon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#moon"></use>
      </svg>
      <svg class="icon icon-sun" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#sun"></use>
      </svg>
    </button>
  </header>


  <!-- Progress Summary Bar -->
  <section class="progress-section" aria-label="Overall progress">
    <div class="progress-summary">
      <div class="progress-stat">
        <span class="stat-number" id="days-done">0</span>
        <span class="stat-label">Days Done</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="overall-bar" role="progressbar"
             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-stat">
        <span class="stat-number" id="days-left">10</span>
        <span class="stat-label">Days Left</span>
      </div>
    </div>
  </section>


  <!-- Filter Bar -->
  <nav class="filter-bar" aria-label="Filter by subject">
    <button class="filter-btn active" data-subject="all">All</button>
    <button class="filter-btn" data-subject="CST201">CST201</button>
    <button class="filter-btn" data-subject="CST203">CST203</button>
    <button class="filter-btn" data-subject="CST205">CST205</button>
    <button class="filter-btn" data-subject="CST207">CST207</button>
    <button class="filter-btn" data-subject="CST209">CST209</button>
  </nav>


  <!-- Day Cards -->
  <main class="roadmap-main" id="roadmap-container">
    <!-- Generated by JS -->
  </main>


  <!-- Reset Button -->
  <div class="reset-wrap">
    <button class="btn-reset" id="btn-reset">Reset All Progress</button>
  </div>


  <!-- Bottom Nav -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="../index.html" class="nav-item">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#home"></use>
      </svg>
      <span>Home</span>
    </a>
    <a href="../pyq/index.html" class="nav-item">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#book"></use>
      </svg>
      <span>PYQ</span>
    </a>
    <a href="../practice/index.html" class="nav-item">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#edit"></use>
      </svg>
      <span>Practice</span>
    </a>
    <a href="../quiz/index.html" class="nav-item">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#award"></use>
      </svg>
      <span>Quiz</span>
    </a>
    <a href="../roadmap/index.html" class="nav-item active" aria-current="page">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/sprite.svg#calendar"></use>
      </svg>
      <span>Roadmap</span>
    </a>
  </nav>


  <script src="index.js"></script>
</body>
</html>
