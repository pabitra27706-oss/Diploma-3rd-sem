<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quiz results and answer review" />
  <title>Quiz Result — QuizApp</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/result.css" />
</head>
<body>

  <!-- ── Site Header ─────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo" aria-label="Go to quiz home">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        QuizApp
      </a>
      <div class="header-actions">
        <button
          class="theme-toggle"
          aria-label="Toggle dark/light theme"
          title="Toggle theme"
        >
          <span class="icon-sun" aria-hidden="true">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
          <span class="icon-moon" aria-hidden="true">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Loading State ───────────────────────────────────────── -->
  <div class="loading-state" id="loading-state" role="status" aria-label="Loading results">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading results…</p>
  </div>

  <!-- ── No Data State ───────────────────────────────────────── -->
  <div class="empty-state hidden" id="no-data-state">
    <!-- Inbox icon -->
    <span class="empty-state-icon" aria-hidden="true">
      <svg class="icon" width="48" height="48" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6
                 l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
    </span>
    <p class="empty-state-title">No Result to Show</p>
    <p class="empty-state-desc">
      Complete a quiz first to see your results here.
    </p>
    <a href="index.html" class="btn btn-primary mt-4">
      <!-- Home icon -->
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Go Home
    </a>
  </div>

  <!-- ── Main Result Content ─────────────────────────────────── -->
  <main class="result-main hidden" id="result-main" role="main">

    <!-- ── Score Hero ────────────────────────────────────────── -->
    <section class="score-hero" aria-labelledby="score-hero-title">
      <div class="container">

        <!-- Result Badge -->
        <div class="result-badge-wrap" id="result-badge-wrap" aria-hidden="true">
          <!-- Filled by JS -->
        </div>

        <!-- CSS Score Ring -->
        <div class="score-ring-wrap" aria-label="Score ring">
          <div class="score-ring" id="score-ring" style="--progress: 0">
            <div class="score-ring-inner">
              <div class="score-fraction" id="score-fraction" aria-live="polite">
                <!-- e.g. 8/10 -->
              </div>
              <div class="score-percentage" id="score-percentage">
                <!-- e.g. 80% -->
              </div>
            </div>
          </div>
        </div>

        <h1 class="score-title" id="score-hero-title" aria-live="polite">
          <!-- Filled by JS -->
        </h1>

        <p class="score-subtitle" id="score-subtitle">
          <!-- Subject · Unit · Date -->
        </p>

        <!-- Score Stats Row -->
        <div class="score-stats-row" role="list" aria-label="Quiz statistics">

          <div class="score-stat" role="listitem">
            <!-- Check icon -->
            <span class="score-stat-icon" aria-hidden="true">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
            <div class="score-stat-body">
              <span class="score-stat-value green" id="stat-correct">0</span>
              <span class="score-stat-label">Correct</span>
            </div>
          </div>

          <div class="score-stat-divider" aria-hidden="true"></div>

          <div class="score-stat" role="listitem">
            <!-- X icon -->
            <span class="score-stat-icon" aria-hidden="true">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </span>
            <div class="score-stat-body">
              <span class="score-stat-value red" id="stat-incorrect">0</span>
              <span class="score-stat-label">Incorrect</span>
            </div>
          </div>

          <div class="score-stat-divider" aria-hidden="true"></div>

          <div class="score-stat" role="listitem">
            <!-- Minus icon -->
            <span class="score-stat-icon" aria-hidden="true">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </span>
            <div class="score-stat-body">
              <span class="score-stat-value gray" id="stat-unanswered">0</span>
              <span class="score-stat-label">Unanswered</span>
            </div>
          </div>

          <div class="score-stat-divider" aria-hidden="true"></div>

          <div class="score-stat" role="listitem">
            <!-- Clock icon -->
            <span class="score-stat-icon" aria-hidden="true">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </span>
            <div class="score-stat-body">
              <span class="score-stat-value accent" id="stat-time">0:00</span>
              <span class="score-stat-label">Time Taken</span>
            </div>
          </div>

        </div>

        <!-- Action Buttons -->
        <div class="score-actions">
          <a href="index.html" class="btn btn-secondary btn-lg">
            <!-- Chevron left -->
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Home
          </a>
          <button
            class="btn btn-outline btn-lg"
            id="btn-retry-same"
            aria-label="Retry the same quiz with reshuffled questions"
          >
            <!-- Refresh icon -->
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
              <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
            Retry
          </button>
          <a
            href="export.html"
            class="btn btn-primary btn-lg"
            id="btn-export-result"
            aria-label="Export quiz results"
          >
            <!-- Upload icon -->
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Export
          </a>
        </div>

      </div>
    </section>

    <!-- ── Performance Chart ──────────────────────────────────── -->
    <section class="container performance-section" aria-labelledby="perf-title">
      <div class="section-card">
        <div class="section-card-header">
          <h2 class="section-card-title" id="perf-title">
            <!-- Trending up icon -->
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
              <polyline points="17 6 23 6 23 12"/>
            </svg>
            Performance Breakdown
          </h2>
        </div>
        <div class="section-card-body">
          <div class="perf-bar-list" id="perf-bar-list" role="list">
            <!-- Filled by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- ── Explanation Controls ───────────────────────────────── -->
    <section
      class="container explanation-controls-section"
      aria-label="Filter question explanations"
    >
      <div class="explanation-controls" role="group" aria-label="Show/hide explanations">
        <span class="explanation-controls-label">
          <!-- Lightbulb icon -->
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="9" y1="18" x2="15" y2="18"/>
            <line x1="10" y1="22" x2="14" y2="22"/>
            <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0
                     18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0
                     0 1 8.91 14"/>
          </svg>
          Explanations:
        </span>
        <button
          class="expl-btn active"
          data-expl="all"
          aria-pressed="true"
        >Show All</button>
        <button
          class="expl-btn"
          data-expl="wrong"
          aria-pressed="false"
        >Wrong Only</button>
        <button
          class="expl-btn"
          data-expl="none"
          aria-pressed="false"
        >Hide All</button>
      </div>
    </section>

    <!-- ── Question Review List ───────────────────────────────── -->
    <section
      class="container question-review-section"
      aria-labelledby="review-list-title"
    >
      <div class="section-header-row">
        <h2 class="section-list-title" id="review-list-title">
          Question Review
        </h2>
        <div class="section-header-filters" role="group" aria-label="Filter questions">
          <button
            class="filter-pill active"
            data-qfilter="all"
            aria-pressed="true"
          >All</button>
          <button
            class="filter-pill"
            data-qfilter="correct"
            aria-pressed="false"
          >
            <!-- Check icon -->
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Correct
          </button>
          <button
            class="filter-pill"
            data-qfilter="incorrect"
            aria-pressed="false"
          >
            <!-- X icon -->
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Wrong
          </button>
          <button
            class="filter-pill"
            data-qfilter="unanswered"
            aria-pressed="false"
          >
            <!-- Minus icon -->
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Blank
          </button>
        </div>
      </div>

      <div
        class="result-question-list"
        id="result-question-list"
        aria-live="polite"
        aria-label="Question review list"
      >
        <!-- Filled by JS -->
      </div>

    </section>

    <!-- ── Bottom Actions ────────────────────────────────────── -->
    <div class="container result-bottom-actions">
      <a href="index.html" class="btn btn-secondary">
        <!-- Chevron left -->
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Home
      </a>
      <div class="result-bottom-right">
        <button
          class="btn btn-outline"
          id="btn-retry-bottom"
          aria-label="Retry quiz"
        >
          <!-- Refresh icon -->
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
          </svg>
          Retry Quiz
        </button>
        <a
          href="export.html"
          class="btn btn-primary"
          aria-label="Export results"
        >
          <!-- Upload icon -->
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Export Results
        </a>
      </div>
    </div>

  </main>

  <!-- ── History View Modal ──────────────────────────────────── -->
  <div
    class="modal-overlay"
    id="history-modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="history-modal-title"
    hidden
  >
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="history-modal-title">
          <!-- Clock icon -->
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Past Quiz
        </h2>
        <button
          class="btn-icon"
          id="close-history-modal"
          aria-label="Close"
        >
          <!-- X icon -->
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="history-modal-body">
        <!-- Filled by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="close-history-modal-footer">
          <!-- X icon -->
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────────── -->
  <script src="js/common.js"></script>
  <script src="js/result.js"></script>

</body>
</html>
