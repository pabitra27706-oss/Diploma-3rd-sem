<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Previous Year Question Papers - Diploma 3rd Semester">
  <title>Previous Year Papers | Diploma 3rd Sem</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <header class="app-header">
    <a href="../index.html" class="back-btn" aria-label="Go to home">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <h1 class="header-title">Previous Year Papers</h1>
    <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main class="main-content">

    <div class="filter-bar">
      <button class="filter-btn active" data-subject="ALL">All</button>
      <button class="filter-btn" data-subject="CST201">CST201</button>
      <button class="filter-btn" data-subject="CST203">CST203</button>
      <button class="filter-btn" data-subject="CST205">CST205</button>
      <button class="filter-btn" data-subject="CST207">CST207</button>
      <button class="filter-btn" data-subject="CST209">CST209</button>
    </div>

    <div class="subjects-container" id="subjectsContainer">
      <div class="loading-state" id="loadingState">
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <p>Loading papers...</p>
      </div>
      <div class="error-state hidden" id="errorState">
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Failed to load papers. Please try again.</p>
        <button class="retry-btn" id="retryBtn">Retry</button>
      </div>
    </div>

  </main>

  <script src="js/index.js"></script>
</body>
</html>
