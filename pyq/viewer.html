<!DOCTYPE html>
<html lang="en">
<head>
<script src="../assets/js/storage.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Question Paper Viewer">
  <title>Question Paper | Diploma 3rd Sem</title>
  <link rel="stylesheet" href="css/viewer.css">
    <script defer src="../assets/js/pwa.js"></script>
    <link rel="stylesheet" href="../assets/css/pwa.css">


<link rel="stylesheet" href="../assets/css/print.css">

<!-- presence:v1 -->
<link rel="canonical" href="https://pabitra27706-oss.github.io/Diploma-3rd-sem/pyq/viewer.html">
<meta name="app-build" content="study-safety-2026-11-09">
<meta property="og:type" content="website">
<meta property="og:title" content="Question Paper | Diploma 3rd Sem">
<meta property="og:description" content="Diploma 3rd Semester CST study resources: notes, practice and previous year questions.">
<meta property="og:url" content="https://pabitra27706-oss.github.io/Diploma-3rd-sem/pyq/viewer.html">
<meta property="og:image" content="https://pabitra27706-oss.github.io/Diploma-3rd-sem/docs/phases/01-platform/screenshots/after-home.png">
<meta property="og:image:alt" content="CST Study Hub homepage screenshot">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Question Paper | Diploma 3rd Sem">
<meta name="twitter:image" content="https://pabitra27706-oss.github.io/Diploma-3rd-sem/docs/phases/01-platform/screenshots/after-home.png">
<link rel="icon" href="../assets/pwa/icon-192x192.png">
<link rel="apple-touch-icon" href="../assets/pwa/icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diploma 3rd Sem">
<link rel="manifest" href="../manifest.json">
<!-- /presence -->
<link rel="stylesheet" href="../assets/css/accessibility.css">
<script defer src="../assets/js/accessibility.js"></script>
</head>
<body>

  <!-- Screen-only toolbar (hidden on print) -->
  <div class="toolbar no-print">
    <a href="index.html" class="tool-btn" aria-label="Back to papers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Back</span>
    </a>
    <div class="toolbar-center" id="toolbarTitle">Loading...</div>
    <a class="tool-btn" id="practiceLink" href="#" aria-label="Practice this paper with answers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      <span>Practice</span>
    </a>
    <button class="tool-btn" id="printBtn" aria-label="Print this paper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span>Print</span>
    </button>
  </div>

  <!-- Loading state -->
  <div class="screen-state no-print" id="loadingState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    <p>Loading question paper...</p>
  </div>

  <!-- Error state -->
  <div class="screen-state no-print hidden" id="errorState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p id="errorMessage">Failed to load question paper.</p>
    <a href="index.html" class="back-link">Go back to papers</a>
  </div>

  <!-- The actual question paper -->
  <div class="paper-wrapper hidden" id="paperWrapper">
    <div class="paper" id="paper">

      <!-- Paper Header -->
      <div class="paper-header">
        <div class="paper-board">West Bengal State Council of Technical and Vocational Education and Skill Development</div>
        <div class="paper-exam">Diploma in Engineering (3rd Semester)</div>
        <div class="paper-subject" id="paperSubjectName"></div>
        <div class="paper-details-row">
          <span id="paperSourceCode"></span>
          <span id="paperMonthYear"></span>
        </div>
        <div class="paper-marks-row">
          <span id="paperDuration">Time: 3 Hours</span>
          <span id="paperTotalMarks"></span>
        </div>
      </div>

      <div class="paper-divider"></div>

      <div class="paper-source-note" id="paperSourceNote"></div>

      <!-- Compact screen overview (full paper is print/PDF only) -->
      <div class="paper-overview" id="paperOverview"></div>

      <!-- Full exam paper; hidden on screen, shown when printing -->
      <div class="paper-body" id="paperBody"></div>

    </div>
  </div>

  <script src="js/viewer.js"></script>
</body>
</html>
